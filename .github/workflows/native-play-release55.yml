name: Sign SautiLink Android 1.1.10 (55)

on:
  push:
    branches: [release/android-1.1.10]
    paths:
      - .github/workflows/native-play-release55.yml
      - .github/scripts/play-candidate/**
      - native-android/**

permissions:
  contents: read

jobs:
  bundle:
    if: github.repository == 'sautilink/sautilink' && github.event.forced == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Restore the existing production Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG"
          printf '%s' "$FIREBASE_CONFIG" | base64 --decode > native-android/app/google-services.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('native-android/app/google-services.json', 'utf8'));
          const packages = (config.client || []).map(client => client?.client_info?.android_client_info?.package_name);
          if (config.project_info?.project_id !== 'sautilink' || !packages.includes('com.sautilink.app')) {
            throw new Error('Expected the SautiLink Firebase production Android client');
          }
          NODE
      - name: Test and build the signed production bundle
        working-directory: native-android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SAUTILINK_KEYSTORE_PATH: ${{ runner.temp }}/sautilink-upload.jks
          SAUTILINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SAUTILINK_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SAUTILINK_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SAUTILINK_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          trap 'rm -f "$SAUTILINK_KEYSTORE_PATH"' EXIT
          gradle :app:testPreviewDebugUnitTest :app:lintProductionRelease :app:bundleProductionRelease --no-daemon --max-workers=2 --no-parallel \
            -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8'
      - name: Verify the upload certificate and seal the artifact
        run: |
          bundle=native-android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          test -s "$bundle"
          unzip -t "$bundle" >/dev/null
          jarsigner -verify "$bundle" | grep -q 'jar verified'
          certificate="$(keytool -printcert -jarfile "$bundle" | awk '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          test "$certificate" = '31c773a7229a563d92f7047a56735ad7b02027d27a6e020d8923dd5418f4b50f'
          out="$RUNNER_TEMP/sautilink-play-55"
          mkdir -p "$out"
          cp "$bundle" "$out/SautiLink-1.1.10-55.aab"
          git rev-parse HEAD > "$out/source-sha.txt"
          java .github/scripts/play-candidate/VerifyPlayBundle.java "$bundle" > "$out/signature-verification.json"
          cp native-android/app/build/reports/lint-results-productionRelease.xml "$out/lint-results-productionRelease.xml"
          cd "$out"
          sha256sum SautiLink-1.1.10-55.aab > SautiLink-1.1.10-55.aab.sha256
      - name: Validate release identity, bundle format and native library alignment
        run: |
          tool="$RUNNER_TEMP/bundletool-1.18.3.jar"
          curl --fail --location --retry 3 --output "$tool" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'"  $tool" | sha256sum --check
          out="$RUNNER_TEMP/sautilink-play-55"
          bundle="$out/SautiLink-1.1.10-55.aab"
          java -jar "$tool" validate --bundle="$bundle"
          java -jar "$tool" dump manifest --bundle="$bundle" --module=base > "$out/production-manifest.xml"
          java -jar "$tool" dump config --bundle="$bundle" > "$out/bundle-config.json"
          python3 .github/scripts/play-candidate/verify_release_layout.py "$bundle" "$out/production-manifest.xml" "$out/bundle-config.json" 55 1.1.10 > "$out/release-layout-verification.json"
          python3 - <<'PY'
          import glob,json,os,xml.etree.ElementTree as ET
          total=failures=errors=0
          files=glob.glob('native-android/app/build/test-results/testPreviewDebugUnitTest/TEST-*.xml')
          assert files, 'No unit test receipts'
          for path in files:
              suite=ET.parse(path).getroot()
              total+=int(suite.get('tests',0));failures+=int(suite.get('failures',0));errors+=int(suite.get('errors',0))
          assert failures==errors==0
          with open(os.environ['RUNNER_TEMP']+'/sautilink-play-55/unit-test-summary.json','w') as out:json.dump(dict(tests=total,failures=failures,errors=errors),out)
          PY
          cd "$out"
          sha256sum SautiLink-1.1.10-55.aab source-sha.txt signature-verification.json lint-results-productionRelease.xml production-manifest.xml bundle-config.json release-layout-verification.json unit-test-summary.json > SHA256SUMS
      - name: Remove transient release inputs
        if: always()
        run: rm -f native-android/app/google-services.json "$RUNNER_TEMP/sautilink-upload.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SautiLink-Play-Release55
          path: ${{ runner.temp }}/sautilink-play-55/
          if-no-files-found: error
          retention-days: 7
