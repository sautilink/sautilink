name: Approved Play release candidate 43

on:
  push:
    branches: [design/native-ios-foundation-20261012]
    paths:
      - .github/workflows/native-play-release43.yml
      - .github/scripts/play-candidate/**

permissions:
  contents: read

concurrency:
  group: approved-play-release43
  cancel-in-progress: false

jobs:
  artifacts:
    if: >-
      github.repository == 'sautilink/sautilink' &&
      github.ref == 'refs/heads/design/native-ios-foundation-20261012' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci: build approved Play release candidate 43' &&
      github.event.forced == false && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Build the reviewed, immutable 1.0.1 (43) source commit.
          # The same SHA and its app/src tree must be pinned in release43.py.
          ref: 8694ac4bc9f3d148b22eef0ba1b0c9a7e9c80cb4
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Prepare pinned source, Firebase, existing signer and official bundletool
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: python3 automation/.github/scripts/play-candidate/release43.py prepare
      - name: Build clean signed production AAB and full production lint
        working-directory: candidate/native-android
        env:
          SAUTILINK_KEYSTORE_PATH: ${{ runner.temp }}/sautilink-play-release43-upload.jks
          SAUTILINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SAUTILINK_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SAUTILINK_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >-
          gradle :app:bundleProductionRelease :app:lintProductionRelease --no-daemon
          --no-configuration-cache --max-workers=1 --no-parallel
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8'
      - name: Cache exact Kotlin compiler dependencies and verify caption behavior
        run: python3 automation/.github/scripts/play-candidate/release43.py check-caption
      - name: Verify signed AAB, production manifest, caption checks and full lint
        run: python3 automation/.github/scripts/play-candidate/release43.py seal-aab
      - name: Seal exact artifact allowlist and checksums
        run: python3 automation/.github/scripts/play-candidate/release43.py seal-outputs
      - name: Remove transient signing, Firebase and caption-check inputs
        if: always()
        run: python3 automation/.github/scripts/play-candidate/release43.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: SautiLink-Play-Release43-${{ github.run_id }}
          path: ${{ runner.temp }}/sautilink-release43-public/
          if-no-files-found: error
          retention-days: 7
