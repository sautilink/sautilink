name: Identity Preview

on:
  push:
    branches:
      - phase-1/identity-preview
    paths:
      - "preview-src/**"
      - "preview/identity/**"
      - "scripts/stage-preview-site.mjs"
      - "assets/brand/**"
      - "assets/fonts/inter/**"
      - "package.json"
      - "package-lock.json"
      - "vite.identity.config.js"
      - "vite.preview.config.js"
      - "wrangler.jsonc"
      - ".github/workflows/identity-preview.yml"

permissions:
  contents: read

jobs:
  deploy-temporary-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build and test isolated previews
        run: npm run check
      - name: Deploy temporary Cloudflare preview
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy --env identity --temporary
