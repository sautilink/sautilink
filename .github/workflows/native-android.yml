name: Native Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

jobs:
  preview:
    name: Build and lint native preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build and lint preview
        working-directory: native-android
        # K2 data-flow analysis of the large feed exceeds 4 GiB; public runners have 16 GiB RAM.
        run: >-
          gradle :app:assemblePreviewDebug :app:lintPreviewDebug --no-daemon
          --max-workers=1 --no-parallel -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        with:
          name: SautiLink-Native-Preview-${{ github.sha }}
          path: native-android/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          if-no-files-found: error

  release:
    name: Sign native production bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore Firebase production client
        shell: bash
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_CONFIG" || { echo "::error::Firebase Android config secret is missing"; exit 1; }
          printf '%s' "$FIREBASE_CONFIG" | base64 --decode > native-android/app/google-services.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('native-android/app/google-services.json', 'utf8'));
          const packages = (config.client || []).map(client => client?.client_info?.android_client_info?.package_name);
          if (config.project_info?.project_id !== 'sautilink' || !packages.includes('com.sautilink.app')) {
            throw new Error('Firebase config does not contain the sautilink production Android client');
          }
          NODE
      - name: Restore existing upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo "::error::A release signing secret is missing"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sautilink-upload.jks"
          test -s "$RUNNER_TEMP/sautilink-upload.jks"
      - name: Build signed production AAB
        working-directory: native-android
        env:
          SAUTILINK_KEYSTORE_PATH: ${{ runner.temp }}/sautilink-upload.jks
          SAUTILINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SAUTILINK_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SAUTILINK_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle :app:bundleProductionRelease --no-daemon
      - name: Verify signed bundle
        shell: bash
        run: |
          bundle=native-android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          test -s "$bundle"
          unzip -t "$bundle" >/dev/null
          jarsigner -verify "$bundle" | grep -q 'jar verified'
          sha256sum "$bundle" > "$bundle.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: SautiLink-Native-Production-AAB-${{ github.sha }}
          path: |
            native-android/app/build/outputs/bundle/productionRelease/app-production-release.aab
            native-android/app/build/outputs/bundle/productionRelease/app-production-release.aab.sha256
          if-no-files-found: error
