name: Caption Entities Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-caption-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build social app bundle
        continue-on-error: true
        run: npm run build:app
      - name: Build preview artifacts
        continue-on-error: true
        run: npm run build:preview
      - name: Verify staging artifact
        continue-on-error: true
        run: npm run verify:staging-artifact
      - name: Build production artifact
        continue-on-error: true
        run: npm run build:production
      - name: Verify production artifact
        continue-on-error: true
        run: npm run verify:production-artifact
      - name: Run caption entity tests
        continue-on-error: true
        run: node --test tests/caption-entities.test.mjs
      - name: Run full test suite
        continue-on-error: true
        run: npm test
