name: Phase 1 Authentication

on:
  pull_request:
    paths:
      - "app/**"
      - "preview/**"
      - "preview-src/**"
      - "scripts/stage-preview-site.mjs"
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "package.json"
      - "package-lock.json"
      - "sw.js"
      - ".assetsignore"
      - "_headers"
      - "wrangler.jsonc"
      - "vite.identity.config.js"
      - "vite.profiles.config.js"
      - "vite.media.config.js"
      - "vite.conversations.config.js"
      - "vite.trust-safety.config.js"
      - "vite.experience.config.js"
      - "vite.share-stream.config.js"
      - "vite.preview.config.js"
      - ".github/workflows/phase-1-auth.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "preview/**"
      - "preview-src/**"
      - "scripts/stage-preview-site.mjs"
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "package.json"
      - "package-lock.json"
      - "sw.js"
      - ".assetsignore"
      - "_headers"
      - "wrangler.jsonc"
      - "vite.identity.config.js"
      - "vite.profiles.config.js"
      - "vite.media.config.js"
      - "vite.conversations.config.js"
      - "vite.trust-safety.config.js"
      - "vite.experience.config.js"
      - "vite.share-stream.config.js"
      - "vite.preview.config.js"
      - ".github/workflows/phase-1-auth.yml"

permissions:
  contents: read

jobs:
  verify-auth-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build and test
        run: npm run check
      - name: Validate Cloudflare deployment
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run deploy:dry

  deploy-identity-preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-1/identity-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Build and test isolated previews
        run: npm run check
      - name: Deploy temporary Cloudflare preview
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy --env identity --temporary

  deploy-profiles-preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-1/profiles-circles-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
