name: Vendor SautiLink Brand System

on:
  push:
    branches: [brand-system-rollout]
    paths:
      - ".github/workflows/vendor-brand-system.yml"

permissions:
  contents: write

jobs:
  rollout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-system-rollout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font tooling
        run: pip install "fonttools[woff]"
      - name: Vendor official brand fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts/lora assets/fonts/zalando-sans-semiexpanded assets/brand
          curl -fsSL "https://raw.githubusercontent.com/cyrealtype/Lora-Cyrillic/403b1a66ca2e79f81d749c5299559e168591a4df/fonts/variable/Lora%5Bwght%5D.ttf" -o /tmp/lora.ttf
          curl -fsSL "https://raw.githubusercontent.com/cyrealtype/Lora-Cyrillic/403b1a66ca2e79f81d749c5299559e168591a4df/fonts/variable/Lora-Italic%5Bwght%5D.ttf" -o /tmp/lora-italic.ttf
          curl -fsSL "https://raw.githubusercontent.com/cyrealtype/Lora-Cyrillic/403b1a66ca2e79f81d749c5299559e168591a4df/OFL.txt" -o assets/fonts/lora/OFL.txt
          curl -fsSL "https://raw.githubusercontent.com/zalando/sans/4e44d0864c4e37ab67fa549cd188aec8776dc948/fonts/variable/ZalandoSansSemiExpanded%5Bwght%5D.ttf" -o /tmp/zalando.ttf
          curl -fsSL "https://raw.githubusercontent.com/zalando/sans/4e44d0864c4e37ab67fa549cd188aec8776dc948/fonts/variable/ZalandoSansSemiExpanded-Italic%5Bwght%5D.ttf" -o /tmp/zalando-italic.ttf
          curl -fsSL "https://raw.githubusercontent.com/zalando/sans/4e44d0864c4e37ab67fa549cd188aec8776dc948/OFL.txt" -o assets/fonts/zalando-sans-semiexpanded/OFL.txt
      - name: Convert to WOFF2
        shell: python
        run: |
          from fontTools.ttLib import TTFont
          pairs = [
            ("/tmp/lora.ttf", "assets/fonts/lora/Lora-Variable.woff2"),
            ("/tmp/lora-italic.ttf", "assets/fonts/lora/Lora-VariableItalic.woff2"),
            ("/tmp/zalando.ttf", "assets/fonts/zalando-sans-semiexpanded/ZalandoSansSemiExpanded-Variable.woff2"),
            ("/tmp/zalando-italic.ttf", "assets/fonts/zalando-sans-semiexpanded/ZalandoSansSemiExpanded-VariableItalic.woff2"),
          ]
          for src, dest in pairs:
            font = TTFont(src)
            font.flavor = "woff2"
            font.save(dest)
      - name: Apply SautiLink brand system to every web page
        shell: python
        run: |
          from pathlib import Path
          import re

          system_css = '''/* SautiLink Corporation web brand system. */
          @font-face { font-family: "Lora"; src: url("/assets/fonts/lora/Lora-Variable.woff2") format("woff2"); font-style: normal; font-weight: 400 700; font-display: swap; }
          @font-face { font-family: "Lora"; src: url("/assets/fonts/lora/Lora-VariableItalic.woff2") format("woff2"); font-style: italic; font-weight: 400 700; font-display: swap; }
          @font-face { font-family: "Zalando Sans SemiExpanded"; src: url("/assets/fonts/zalando-sans-semiexpanded/ZalandoSansSemiExpanded-Variable.woff2") format("woff2"); font-style: normal; font-weight: 200 900; font-display: swap; }
          @font-face { font-family: "Zalando Sans SemiExpanded"; src: url("/assets/fonts/zalando-sans-semiexpanded/ZalandoSansSemiExpanded-VariableItalic.woff2") format("woff2"); font-style: italic; font-weight: 200 900; font-display: swap; }
          :root {
            --brand-primary: #2563eb;
            --brand-primary-hover: #1d4ed8;
            --brand-light: #60a5fa;
            --brand-white: #ffffff;
            --font-primary: "Lora", Georgia, "Times New Roman", serif;
            --font-brand: "Zalando Sans SemiExpanded", Arial, sans-serif;
            --red: var(--brand-primary);
            --blue: var(--brand-primary);
          }
          html, body, button, input, textarea, select { font-family: var(--font-primary) !important; }
          .logo, .brand, .brand-name, .brand-product, footer, .copyright, [data-brand-font] { font-family: var(--font-brand) !important; }
          ::selection { background: var(--brand-light); color: #0f172a; }
          '''
          system_css = "\n".join(line.strip() for line in system_css.splitlines() if line.strip()) + "\n"
          Path("assets/brand/system.css").write_text(system_css, encoding="utf-8")

          preload = '''    <link rel="preload" href="/assets/fonts/lora/Lora-Variable.woff2" as="font" type="font/woff2" crossorigin>
              <link rel="preload" href="/assets/fonts/zalando-sans-semiexpanded/ZalandoSansSemiExpanded-Variable.woff2" as="font" type="font/woff2" crossorigin>
              <link rel="stylesheet" href="/assets/brand/system.css">'''

          for path in Path(".").glob("*.html"):
            if path.name.startswith("google"):
              continue
            text = path.read_text(encoding="utf-8")
            if "<head" not in text.lower():
              continue
            lines = []
            for line in text.splitlines():
              if "fonts.googleapis.com" in line or "fonts.gstatic.com" in line:
                continue
              lines.append(line)
            text = "\n".join(lines) + "\n"
            text = text.replace("#e11d48", "#2563eb").replace("#E11D48", "#2563EB")
            text = text.replace("#be123c", "#1d4ed8").replace("#BE123C", "#1D4ED8")
            text = text.replace("#e11b1b", "#2563eb").replace("#E11B1B", "#2563EB")
            text = text.replace("rgba(225,29,72,", "rgba(37,99,235,")
            text = text.replace("rgba(225, 29, 72,", "rgba(37, 99, 235,")
            text = re.sub(r"font-family:\s*['\"]Bricolage Grotesque['\"][^;]*;", "font-family: var(--font-primary);", text)
            text = re.sub(r'(<meta\s+name=["\']theme-color["\']\s+content=["\'])#[0-9a-fA-F]{6}(["\'])', r'\1#2563eb\2', text)
            if "/assets/brand/system.css" not in text:
              text = text.replace("</head>", preload + "\n</head>", 1)
            path.write_text(text, encoding="utf-8")

          Path("assets/brand/README.md").write_text(
            "# SautiLink Corporation Brand System\n\n"
            "Primary font: Lora (400–700, normal/italic).\n\n"
            "Corporate font: Zalando Sans SemiExpanded (200–900, normal/italic).\n\n"
            "Colors: Primary Blue #2563EB, Light Blue #60A5FA, White #FFFFFF. Neutral colors may be used for contrast/accessibility.\n\n"
            "Fonts are self-hosted under their included SIL Open Font License files.\n",
            encoding="utf-8"
          )
      - name: Commit rollout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Apply SautiLink corporate brand system"
          git push origin HEAD:brand-system-rollout
