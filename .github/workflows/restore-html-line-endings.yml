name: Restore HTML Line Endings

on:
  push:
    branches: [brand-system-rollout]
    paths:
      - ".github/workflows/restore-html-line-endings.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-system-rollout
      - name: Restore CRLF for existing root HTML pages
        shell: python
        run: |
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              if path.name.startswith('google'):
                  continue
              text = path.read_text(encoding='utf-8')
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  f.write(text.replace('\r\n','\n').replace('\r','\n').replace('\n','\r\n'))
      - name: Commit line-ending cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Preserve existing HTML line endings"
          git push origin HEAD:brand-system-rollout
