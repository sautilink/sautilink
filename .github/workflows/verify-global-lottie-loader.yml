name: Verify global Lottie loader

on:
  push:
    branches:
      - feature/global-lottie-loader
    paths:
      - .github/workflows/verify-global-lottie-loader.yml
      - app/index.html
      - assets/lottie-loader.js
      - assets/lottie-loader.css
      - assets/launch-splash.js
      - assets/launch-splash.css
      - assets/animations/**
      - assets/vendor/lottie-web/**
      - sw.js
      - THIRD_PARTY_NOTICES.md
      - tests/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/global-lottie-loader

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax-check loader scripts
        run: |
          node --check assets/lottie-loader.js
          node --check assets/launch-splash.js
          node --check sw.js

      - name: Build app and previews
        run: npm run build

      - name: Verify staging artifact
        run: npm run verify:staging-artifact

      - name: Build production artifact
        run: npm run build:production

      - name: Verify production artifact
        run: npm run verify:production-artifact

      - name: Verify post translation artifact
        run: npm run verify:post-translation-artifact

      - name: Run full test suite
        run: npm test

      - name: Verify Lottie integration and source assets
        run: |
          grep -Fq '<script src="/assets/lottie-loader.js?v=20260917-lottie1" defer></script>' dist-production-site/app/index.html
          test -s assets/lottie-loader.js
          test -s assets/lottie-loader.css
          test -s assets/vendor/lottie-web/lottie_light.min.js
          test -s assets/vendor/lottie-web/LICENSE.md
          test -s assets/animations/sautilink-loader/animations/12345.json
          grep -Fq '/assets/lottie-loader.js?v=20260917-lottie1' sw.js
          grep -Fq '/assets/vendor/lottie-web/lottie_light.min.js' sw.js
          grep -Fq '/assets/animations/sautilink-loader/animations/12345.json' sw.js
          git diff --check

      - name: Dry-run production worker deployment
        run: npx wrangler deploy --config wrangler.production.jsonc --dry-run

      - name: Smoke-test live Lottie release
        shell: bash
        run: |
          set -euo pipefail
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          app="$(mktemp)"
          loader="$(mktemp)"
          css="$(mktemp)"
          runtime="$(mktemp)"
          animation="$(mktemp)"
          health="$(mktemp)"

          curl -fsS -H 'Cache-Control: no-cache' "https://sautilink.com/app/?lottie_release=$release" -o "$app"
          curl -fsS -H 'Cache-Control: no-cache' "https://sautilink.com/assets/lottie-loader.js?v=20260917-lottie1&release=$release" -o "$loader"
          curl -fsS -H 'Cache-Control: no-cache' "https://sautilink.com/assets/lottie-loader.css?v=20260917-lottie1&release=$release" -o "$css"
          curl -fsS -H 'Cache-Control: no-cache' "https://sautilink.com/assets/vendor/lottie-web/lottie_light.min.js?release=$release" -o "$runtime"
          curl -fsS -H 'Cache-Control: no-cache' "https://sautilink.com/assets/animations/sautilink-loader/animations/12345.json?release=$release" -o "$animation"
          curl -fsS -H 'Cache-Control: no-cache' "https://sautilink.com/api/health?release=$release" -o "$health"

          grep -Fq '<script src="/assets/lottie-loader.js?v=20260917-lottie1" defer></script>' "$app"
          grep -Fq 'SautiLinkLottieLoader' "$loader"
          grep -Fq '.sautilink-lottie-loader' "$css"
          test -s "$runtime"
          grep -Fq '"layers"' "$animation"
          grep -Fq '"status":"ok"' "$health"
          grep -Fq '"environment":"production"' "$health"
